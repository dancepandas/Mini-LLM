# ===========================================================================
# 预训练配置
# ---------------------------------------------------------------------------
# 所有默认值都来自本机 RTX 2060 6GB 的**实测**（scripts/00_setup.py 可复现）。
#
# ## 最重要的实测发现：梯度累积会导致显存碎片化
#
#   **单步基准测试的显存数字会显著低估真实训练的占用。**
#
#   基准测试（每次前向反向后就更新参数）：
#       micro_batch=4 → reserved 4.90GB，4618 tok/s   ✅ 看起来没问题
#
#   真实训练（连续 32 次前向反向才更新一次参数）：
#       micro_batch=4 → reserved 6.13GB，3991 tok/s   ❌ 超售 1.1GB！
#
#   原因：梯度累积时反复分配/释放中间张量，PyTorch 的缓存分配器
#   会因碎片化而不断扩张自己的池子（4.90GB → 6.13GB）。
#   超售后 Windows 会静默换页，5 天的训练会拖成更久。
#
# ## 实测的配置对比（有效 batch 固定 131k tokens）
#
#   mb=1 seq=1024 accum=128 → 4001 tok/s, 峰值 4.34GB   ✅ 当前配置
#   mb=2 seq=512  accum=128 → 3999 tok/s, 峰值 4.34GB   ✅ 但序列更短
#   mb=2 seq=1024 accum=64  → 4603 tok/s, 峰值 4.99GB   ⚠️ 压线，无余量
#   mb=3 seq=1024 accum=44  → 4336 tok/s, 峰值 5.81GB   ❌ 超售
#   mb=4 seq=1024 accum=32  → 3991 tok/s, 峰值 6.13GB   ❌ 超售
#
#   mb=2 虽然快 15%，但 4.99GB 正好卡在 4.98GB 空闲显存上，没有任何余量 ——
#   用户开个浏览器就会超售。**稳定性优先于 15% 的速度**，故选 mb=1。
#
# ===========================================================================

# ---- 批次与序列 ----
micro_batch_size: 1      # 【硬约束】保持 1，见上面的实测分析
grad_accum_steps: 128    # 1 * 128 * 1024 = 131k tokens / 次参数更新
seq_len: 1024            # mb=1 才保得住 1024 的序列长度

# ---- 优化 ----
lr: 3.0e-4
min_lr_ratio: 0.1
warmup_steps: 2000       # 约占总步数的 13%
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0           # fp16 训练必须开，防梯度爆炸
optimizer: adamw8bit     # 【必需】普通 fp32 AdamW 会多占 1.9GB → 超售 → 慢 16 倍

# ---- 精度 ----
dtype: fp16              # sm_75 无 bf16 硬件加速

# ---- 显存优化 ----
gradient_checkpointing: true   # 【必需】关掉后连 batch=2 都超售

# ---- 训练规模 ----
# 13000 步 × 131072 tokens = 1.70B tokens
# 预计耗时 1.70e9 / 4001 tok/s ≈ 118 小时 ≈ 4.9 天（本机实测吞吐）
#
# 为什么是 1.70B 而不是原计划的 2B：
#   实测真实吞吐（含梯度累积的碎片化影响）是 4001 tok/s 而不是基准测试的 4618。
#   2B 需要 5.8 天，加上 SFT/RL 会超过一周的期限。
#   1.70B 用 4.9 天，给后续阶段留出缓冲。
#
# 想改预算就改 max_steps：步数 = 目标tokens / 131072
#   1.0B → 7630 步 ≈ 2.9 天
#   1.7B → 13000 步 ≈ 4.9 天  （当前）
#   2.0B → 15260 步 ≈ 5.8 天
max_steps: 13000

# ---- 日志与保存 ----
log_interval: 10
eval_interval: 1000
# checkpoint 间隔。从 500 降到 250 的原因：
#   2026-10-02 预训练被意外中断过一次（step 4810 被杀），
#   回退到最近的 checkpoint（step 4500）损失了 310 步 ≈ 1.7 小时算力。
#   每步约 31.5 秒，所以 500 步间隔意味着单次中断最多损失约 4.4 小时。
#   降到 250 把这个上界压到约 2.2 小时。代价是磁盘 IO 更频繁，
#   但只保留最近 3 个（共约 5.7GB），完全可接受。
#   对一个已经中断过一次的任务，这个保险值得买。
save_interval: 250
keep_last_n_checkpoints: 3

seed: 1337
out_dir: checkpoints/pretrain
run_name: pretrain_0.3b
