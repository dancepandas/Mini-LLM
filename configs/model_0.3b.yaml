# ===========================================================================
# 0.3B 模型结构配置
# ---------------------------------------------------------------------------
# 实测参数量：316.7M
# 这是本项目的主模型配置，所有阶段（预训练/SFT/RL）都基于它。
#
# 硬件约束提醒（RTX 2060 6GB / sm_75）：
#   - 必须用 fp16，不能用 bf16（Turing 没有 bf16 张量核）
#   - 必须强制 mem_efficient 注意力后端（见 minilm/model.py）
# ===========================================================================

# ---- 词表与维度 ----
vocab_size: 32768        # 含预留特殊 token；< 65536 以便用 uint16 存训练数据
d_model: 1024            # 隐藏维度。取 1024 让 head_dim 正好是 64
n_layers: 24             # Transformer 层数
n_heads: 16              # Q 头数
n_kv_heads: 8            # KV 头数（GQA 2:1）。推理 KV cache 减半，RL 阶段能装下两个模型
intermediate_size: 2816  # SwiGLU 中间维度 ≈ 4*d_model*2/3，取到 256 的整数倍

# ---- 序列与位置编码 ----
max_seq_len: 1024        # 预训练用 1024 换速度；mem_efficient 下提到 2048 显存几乎不涨
rope_theta: 10000.0      # RoPE 基底频率

# ---- 归一化与正则 ----
rms_norm_eps: 1.0e-5
dropout: 0.0             # 2B tokens 的规模下不需要 dropout

# ---- 初始化 ----
initializer_range: 0.02

# ---- 权重共享 ----
tie_word_embeddings: true   # 省下 33.6M 参数（占总量的 10%）
